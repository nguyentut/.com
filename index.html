<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nguyễn tú 🖤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .container {
    max-width: 480px;
    width: 100%;
    background: #ffffff;
    border: 3px solid #ff4d8d;
    border-radius: 28px;
    padding: 30px 22px;
    box-shadow: 0 10px 40px rgba(255, 77, 141, 0.15), 0 2px 10px rgba(255, 77, 141, 0.08);
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(255,77,141,0.1) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Đã đổi tên tiêu đề tại đây */
  .title {
    font-size: 21px;
    font-weight: 800;
    color: #ff2d6f;
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 13px;
    color: #888;
    text-align: center;
    margin-bottom: 26px;
  }

  .step {
    background: #fff8fb;
    border: 1.5px solid #ffd1e3;
    border-radius: 18px;
    padding: 18px 16px;
    margin-bottom: 16px;
    position: relative;
    transition: all 0.3s ease;
  }

  .step.completed {
    background: #f0fff4;
    border-color: #a8e6b8;
  }

  .step-badge {
    position: absolute;
    top: -10px; left: 16px;
    background: #ff4d8d;
    color: white;
    font-size: 11px;
    font-weight: 700;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(255,77,141,0.3);
  }

  .btn {
    width: 100%;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 2px solid transparent;
    font-family: inherit;
  }

  .btn-icon { font-size: 18px; }

  .btn-tiktok {
    background: #ff4d8d;
    color: white;
    border-color: #ff4d8d;
  }

  .btn-tiktok:hover, .btn-tiktok:active {
    background: #ff2d6f;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,77,141,0.35);
  }

  .btn-claim {
    background: #f5f5f5;
    color: #aaa;
    border-color: #ddd;
    cursor: not-allowed;
  }

  .btn-claim:not(:disabled) {
    background: linear-gradient(135deg, #ff4d8d, #ff2d6f);
    color: white;
    border-color: #ff2d6f;
    cursor: pointer;
    animation: glowPink 1.5s ease-in-out infinite alternate;
  }

  .btn-claim:not(:disabled):hover,
  .btn-claim:not(:disabled):active {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255,45,111,0.45);
  }

  @keyframes glowPink {
    from { box-shadow: 0 0 5px rgba(255,77,141,0.3); }
    to   { box-shadow: 0 0 18px rgba(255,77,141,0.6); }
  }

  .hint {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    margin-top: 8px;
    font-style: italic;
  }

  .hint.unlocked {
    color: #22a35b;
    font-weight: 600;
    font-style: normal;
  }

  /* Đã xoá phần CSS của .timer-box và .countdown */

  .btn-reset {
    display: block;
    margin: 22px auto 0;
    background: transparent;
    border: 1.5px solid #ffd1e3;
    color: #ff4d8d;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-reset:hover, .btn-reset:active {
    background: #fff0f6;
    border-color: #ff4d8d;
  }
</style>
</head>
<body>

<div class="container">
  <!-- ĐÃ ĐỔI TÊN TẠI ĐÂY -->
  <h1 class="title">nguyễn tú 🖤</h1>
  <p class="subtitle">Hoàn thành 2 bước để nhận phần thưởng</p>

  <!-- Bước 1 -->
  <div class="step" id="step1">
    <div class="step-badge">1</div>
    <button id="tiktokBtn" class="btn btn-tiktok">
      <span class="btn-icon">🎵</span>
      Follow TikTok & Tim Video
    </button>
    <p class="hint">Nhấn để mở TikTok và thực hiện follow + tim video</p>
  </div>

  <!-- Bước 2 -->
  <div class="step" id="step2">
    <div class="step-badge">2</div>
    <button id="claimBtn" class="btn btn-claim" disabled>
      🔒 Nhận Nguyên Tử
    </button>
    <p class="hint" id="claimHint">Hoàn thành bước 1 để mở khóa</p>
  </div>

  <!-- ĐÃ XOÁ BỘ ĐẾM NGƯỢC Ở ĐÂY -->

  <!-- Reset -->
  <button id="resetBtn" class="btn-reset">🔄 Làm mới trạng thái</button>
</div>

<script>
  // ========== CẤU HÌNH ==========
  var TIKTOK_URL = 'https://www.tiktok.com/@tangquaking';
  var CLAIM_URL  = 'https://phienchoso.com/f1388e7de8a51d7e9881.tk';
  var COUNTDOWN_SECONDS = 60;

  // ========== DOM ==========
  var tiktokBtn  = document.getElementById('tiktokBtn');
  var claimBtn   = document.getElementById('claimBtn');
  var claimHint  = document.getElementById('claimHint');
  var resetBtn   = document.getElementById('resetBtn');
  var step1      = document.getElementById('step1');
  var step2      = document.getElementById('step2');

  var countdownInterval = null;

  // ========== LƯU / ĐỌC TRẠNG THÁI ==========
  function saveState(unlocked) {
    try { localStorage.setItem('tiktokUnlocked', unlocked ? 'true' : 'false'); } catch(e) {}
  }

  function readState() {
    try { return localStorage.getItem('tiktokUnlocked') === 'true'; } catch(e) { return false; }
  }

  // ========== KHÓA ==========
  function lockClaimButton() {
    claimBtn.disabled = true;
    claimBtn.innerHTML = '🔒 Nhận Nguyên Tử';
    claimHint.textContent = 'Hoàn thành bước 1 để mở khóa';
    claimHint.classList.remove('unlocked');
    step1.classList.remove('completed');
    step2.classList.remove('completed');
    saveState(false);
    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
  }

  // ========== MỞ KHÓA ==========
  function unlockClaimButton() {
    claimBtn.disabled = false;
    claimBtn.innerHTML = '✅ Nhận Nguyên Tử';
    claimHint.textContent = 'Đã mở khóa! Nhấn để nhận thưởng.';
    claimHint.classList.add('unlocked');
    step1.classList.add('completed');
    step2.classList.add('completed');
    saveState(true);
    startCountdown(COUNTDOWN_SECONDS);
  }

  // ========== ĐẾM NGƯỢC NGẦM (KHÔNG HIỂN THỊ) ==========
  function startCountdown(seconds) {
    if (countdownInterval) clearInterval(countdownInterval);
    var remaining = seconds;

    // Không cập nhật DOM nữa vì đã ẩn giao diện
    countdownInterval = setInterval(function() {
      remaining--;
      if (remaining <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        lockClaimButton();
        alert('⏰ Hết thời gian 1 phút! Vui lòng thực hiện lại bước 1 để mở khóa.');
      }
    }, 1000);
  }

  // ========== SỰ KIỆN ==========
  tiktokBtn.addEventListener('click', function() {
    window.open(TIKTOK_URL, '_blank');
    unlockClaimButton();
  });

  claimBtn.addEventListener('click', function() {
    if (!claimBtn.disabled) {
      window.open(CLAIM_URL, '_blank');
    }
  });

  resetBtn.addEventListener('click', function() {
    lockClaimButton();
    alert('🔄 Đã làm mới trạng thái. Vui lòng follow TikTok lại.');
  });

  // ========== KHỞI CHẠY ==========
  if (readState()) {
    unlockClaimButton();
  } else {
    lockClaimButton();
  }
</script>
</body>
</html>
